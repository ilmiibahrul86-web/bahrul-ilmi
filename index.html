
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BahrulChat Online</title>
<style>
:root{--bg:#020b16;--panel:#07192c;--border:#173651;--green:#00ed8a;--muted:#91b0d1}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#0b2b40,#020b16 65%);color:#eff7ff;font:15px Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.app{height:100dvh;padding:12px;display:grid;grid-template-columns:270px 1fr;gap:12px}
.panel{background:#061629ed;border:1px solid var(--border);border-radius:18px;overflow:hidden;min-height:0}
.side{display:flex;flex-direction:column}
.brand{padding:20px;border-bottom:1px solid var(--border);font-size:23px;font-weight:bold}
.brand span{color:var(--green)}
.sub{font-size:11px;color:var(--muted);margin-top:7px}
.profile{padding:15px;display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00ed8a,#008f9d);display:grid;place-items:center;color:#002d1c;font-weight:bold;flex-shrink:0}
.pname{flex:1;overflow:hidden}
small{color:var(--muted)}
input{width:100%;padding:12px;background:#071a30;color:white;border:1px solid var(--border);border-radius:10px;outline:none}
input:focus{border-color:var(--green)}
.search{padding:0 12px 12px}
.actions{display:flex;gap:7px;padding:0 12px 14px}
button{border:1px solid var(--border);background:#0b2038;color:white;padding:10px;border-radius:10px}
.actions button{flex:1;font-size:12px}
.primary{background:linear-gradient(110deg,#00ed8a,#00b96b);color:#002e1b;border:0;font-weight:bold}
.section{padding:5px 15px 10px;font-size:12px;font-weight:bold}
.groups{overflow:auto;padding:0 8px}
.group{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:4px;overflow-wrap:anywhere}
.group:hover,.group.active{background:#07372f;border-left:3px solid var(--green)}
.group small{display:block;margin-top:6px}
.footer{margin-top:auto;padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.chat{display:flex;flex-direction:column}
.head{padding:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border)}
.head h2{font-size:17px;margin:0 0 6px;overflow-wrap:anywhere}
.head .sub{margin:0}
.head button{margin-left:auto}
.messages{flex:1;overflow:auto;padding:17px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 12px;border:1px solid #20405c;border-radius:5px 14px 14px 14px;background:#102944;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:#006b4d;border-color:#078966;border-radius:14px 5px 14px 14px}
.sender{font-size:11px;color:#8ef6c5;font-weight:bold;margin-bottom:6px}
.body{white-space:pre-wrap;line-height:1.5}
.time{text-align:right;font-size:10px;color:#c2d8e7;margin-top:6px}
.msg img,.msg video{display:block;max-width:100%;max-height:260px;border-radius:8px;margin-top:8px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.composer input{flex:1;min-width:0}
.status{padding:7px 12px;color:var(--muted);font-size:11px;text-align:center}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px}
.dialog{width:min(400px,100%);padding:22px;background:#081a2d;border:1px solid var(--border);border-radius:17px}
.dialog h2{margin-top:0}
.dialog input{margin-bottom:12px}
.dialog .actions{padding:5px 0 0}
#notice{color:#ffb4b4;font-size:12px;padding:0 15px 10px}
@media(max-width:650px){
 .app{padding:5px;gap:6px;display:flex;flex-direction:column}
 .side{flex:0 0 auto;max-height:38%}
 .brand{padding:10px 13px;font-size:19px}
 .profile{padding:8px 12px}.profile .avatar{width:32px;height:32px}
 .actions{padding-bottom:8px}.actions button{padding:8px}
 .search{padding-bottom:8px}
 .groups{display:flex;overflow-x:auto;overflow-y:hidden}
 .group{min-width:125px;align-self:flex-start}
 .footer{display:none}
 .chat{flex:1;min-height:0}
 .head{padding:10px}.messages{padding:10px}
 .composer{padding:7px;gap:5px}.msg{max-width:95%}
}
</style>
</head>
<body>
<div class="app">
 <aside class="panel side">
  <div class="brand">Bahrul<span>Chat</span><div class="sub">CHAT BERSAMA TEMAN SECARA ONLINE</div></div>
  <div class="profile">
   <div class="avatar" id="avatar">B</div>
   <div class="pname"><b id="username">Memuat...</b><div class="sub">● Terhubung</div></div>
   <button id="rename">✎</button>
  </div>
  <div class="search"><input id="search" placeholder="Cari grup..."></div>
  <div class="actions">
   <button class="primary" id="create">＋ Buat Grup</button>
   <button id="join">↗ Gabung</button>
  </div>
  <div class="section">GRUP SAYA</div>
  <div class="groups" id="groups"></div>
  <div id="notice"></div>
  <div class="footer">BAHRULCHAT ONLINE · FIREBASE</div>
 </aside>

 <main class="panel chat">
  <header class="head">
   <div class="avatar">👥</div>
   <div style="min-width:0;flex:1"><h2 id="chatTitle">BahrulChat Online</h2><div class="sub" id="chatSub">Buat atau gabung grup</div></div>
   <button id="copy" disabled>Salin Kode</button>
  </header>
  <section class="messages" id="messages">
   <div style="text-align:center;color:var(--muted);margin:auto">💬<br>Selamat datang di BahrulChat</div>
  </section>
  <form class="composer" id="form">
   <input id="text" placeholder="Pilih grup terlebih dahulu..." autocomplete="off" disabled>
   <input id="file" type="file" accept="image/*,video/*" hidden>
   <button type="button" id="attach" disabled>＋</button>
   <button class="primary" id="send" disabled>Kirim ➤</button>
  </form>
  <div class="status" id="status">Menghubungkan ke Firebase...</div>
 </main>
</div>

<div class="modal" id="modal">
 <div class="dialog">
  <h2 id="modalTitle">BahrulChat</h2>
  <div id="fields"></div>
  <div class="actions">
   <button id="cancel">Batal</button>
   <button class="primary" id="confirm">Lanjutkan</button>
  </div>
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
 getAuth,signInAnonymously,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
 getFirestore,collection,doc,addDoc,getDoc,setDoc,updateDoc,
 query,where,onSnapshot,orderBy,serverTimestamp,arrayUnion
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import {
 getStorage,ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyC30ZkDq_Q51ht7eVmir_6jiRF4FeU4IPE",
  authDomain: "bahrulchat.firebaseapp.com",
  projectId: "bahrulchat",
  storageBucket: "bahrulchat.firebasestorage.app",
  messagingSenderId: "1027502837197",
  appId: "1:1027502837197:web:db70a28c79f809453c8884",
  measurementId: "G-PLGC2VXDQL"
};

const $=id=>document.getElementById(id);
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

let user=null,displayName=localStorage.getItem("bc_name")||"Bahrul";
let current=null,stopGroups=null,stopMessages=null,groupsData=[];
let busy=false;

function say(message){$("notice").textContent=message}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function randomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function showModal(title,html,callback){
 $("modalTitle").textContent=title;$("fields").innerHTML=html;
 $("modal").style.display="grid";
 $("confirm").onclick=async()=>{
  if(busy)return;
  try{await callback()}catch(e){console.error(e);say("Gagal: "+e.message)}
 };
}
function closeModal(){$("modal").style.display="none"}
$("cancel").onclick=closeModal;
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};

function updateProfile(){
 $("username").textContent=displayName;
 $("avatar").textContent=displayName.charAt(0).toUpperCase();
}
$("rename").onclick=()=>showModal("Ganti Nama",
 '<input id="newName" maxlength="30" placeholder="Nama kamu" value="'+esc(displayName)+'">',
 async()=>{
  const n=$("newName").value.trim();
  if(!n)return alert("Masukkan nama.");
  displayName=n;localStorage.setItem("bc_name",n);
  updateProfile();closeModal();
 });

onAuthStateChanged(auth,async u=>{
 if(!u){
  try{await signInAnonymously(auth)}catch(e){say("Login Firebase gagal: "+e.message)}
  return;
 }
 user=u;
 updateProfile();
 listenGroups();
 $("status").textContent="Terhubung ke Firebase";
});

function listenGroups(){
 if(stopGroups)stopGroups();
 const q=query(collection(db,"groups"),where("members","array-contains",user.uid));
 stopGroups=onSnapshot(q,snap=>{
  groupsData=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderGroups();
 },e=>say("Tidak bisa memuat grup: "+e.message));
}
function renderGroups(){
 const q=$("search").value.toLowerCase();
 $("groups").innerHTML="";
 groupsData.filter(g=>(g.name||"").toLowerCase().includes(q)).forEach(g=>{
  const el=document.createElement("div");
  el.className="group"+(current===g.id?" active":"");
  el.innerHTML="<b>👥 "+esc(g.name)+"</b><small>KODE "+esc(g.code||"")+"</small>";
  el.onclick=()=>openGroup(g.id);
  $("groups").appendChild(el);
 });
 if(! $("groups").children.length){
  $("groups").innerHTML='<div style="padding:12px;color:var(--muted);font-size:12px">Belum ada grup. Buat grup baru atau gabung dengan kode.</div>';
 }
}
$("search").oninput=renderGroups;

$("create").onclick=()=>showModal("Buat Grup",
 '<input id="groupName" maxlength="40" placeholder="Nama grup">',
 async()=>{
  const name=$("groupName").value.trim();
  if(!name)return alert("Masukkan nama grup.");
  busy=true;$("confirm").disabled=true;
  try{
   let code=randomCode(),taken;
   do{
    const q=query(collection(db,"groups"),where("code","==",code));
    taken=await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js")
     .then(m=>m.getDocs(q));
    if(!taken.empty)code=randomCode();
   }while(!taken.empty);
   const group=await addDoc(collection(db,"groups"),{
    name,code,owner:user.uid,members:[user.uid],
    createdAt:serverTimestamp()
   });
   closeModal();await openGroup(group.id);say("Grup berhasil dibuat. Bagikan kode "+code);
  }finally{busy=false;$("confirm").disabled=false}
 });

$("join").onclick=()=>showModal("Gabung Grup",
 '<input id="groupCode" maxlength="6" placeholder="Masukkan kode undangan">',
 async()=>{
  const code=$("groupCode").value.trim().toUpperCase();
  if(!code)return alert("Masukkan kode grup.");
  busy=true;$("confirm").disabled=true;
  try{
   const m=await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");
   const snap=await m.getDocs(query(collection(db,"groups"),where("code","==",code)));
   if(snap.empty)return alert("Kode grup tidak ditemukan.");
   const d=snap.docs[0];
   await updateDoc(doc(db,"groups",d.id),{members:arrayUnion(user.uid)});
   closeModal();await openGroup(d.id);say("Berhasil bergabung ke "+d.data().name);
  }finally{busy=false;$("confirm").disabled=false}
 });

async function openGroup(id){
 current=id;
 if(stopMessages){stopMessages();stopMessages=null}
 const g=await getDoc(doc(db,"groups",id));
 if(!g.exists()||!g.data().members.includes(user.uid)){
  current=null;return say("Grup tidak tersedia atau kamu bukan anggotanya.");
 }
 const data=g.data();
 $("chatTitle").textContent=data.name;
 $("chatSub").textContent="Kode undangan: "+data.code;
 $("copy").disabled=false;$("text").disabled=false;
 $("attach").disabled=false;$("send").disabled=false;
 renderGroups();
 const q=query(collection(db,"groups",id,"messages"),orderBy("createdAt","asc"));
 stopMessages=onSnapshot(q,snap=>{
  const box=$("messages");box.innerHTML="";
  snap.forEach(d=>{
   const m=d.data(),el=document.createElement("div");
   el.className="msg"+(m.uid===user.uid?" mine":"");
   let media="";
   if(m.url&&m.type?.startsWith("image/"))media='<img src="'+esc(m.url)+'" alt="Lampiran">';
   if(m.url&&m.type?.startsWith("video/"))media='<video src="'+esc(m.url)+'" controls></video>';
   let time=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}):"";
   el.innerHTML='<div class="sender">'+esc(m.name)+'</div><div class="body">'+esc(m.text||"")+'</div>'+media+'<div class="time">'+time+'</div>';
   box.appendChild(el);
  });
  box.scrollTop=box.scrollHeight;
 },e=>say("Gagal memuat pesan: "+e.message));
}

$("copy").onclick=async()=>{
 const g=groupsData.find(x=>x.id===current);if(!g)return;
 try{await navigator.clipboard.writeText(g.code);say("Kode "+g.code+" berhasil disalin")}
 catch{prompt("Salin kode grup ini:",g.code)}
};

$("attach").onclick=()=>$("file").click();
$("form").onsubmit=async e=>{
 e.preventDefault();
 if(!current||busy)return;
 const text=$("text").value.trim(),file=$("file").files[0];
 if(!text&&!file)return;
 if(file&&file.size>10*1024*1024)return alert("Pilih file maksimal 10 MB.");
 if(file&&!file.type.startsWith("image/")&&!file.type.startsWith("video/"))
  return alert("Pilih gambar atau video.");
 busy=true;$("send").disabled=true;
 try{
  let url="",type="";
  if(file){
   $("status").textContent="Mengunggah file...";
   const path="chatFiles/"+current+"/"+user.uid+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
   const result=await uploadBytes(ref(storage,path),file);
   url=await getDownloadURL(result.ref);type=file.type;
  }
  await addDoc(collection(db,"groups",current,"messages"),{
   uid:user.uid,name:displayName,text,url,type,createdAt:serverTimestamp()
  });
  $("text").value="";$("file").value="";
  $("status").textContent="Pesan terkirim";
 }catch(err){console.error(err);say("Gagal mengirim: "+err.message)}
 finally{busy=false;$("send").disabled=false}
};
</script>
</body>
</html>
